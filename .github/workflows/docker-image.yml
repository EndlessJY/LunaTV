name: Build & Push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 标签'
        required: false
        default: 'latest'
        type: string
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare platform name
        run: |
          echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -m1 "^## \[" CHANGELOG | sed 's/^## \[\(.*\)\] - .*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            endlessjy/lunatv
            ghcr.io/${{ steps.lowercase.outputs.owner }}/lunatv

      - name: Build image for pull request validation
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            endlessjy/lunatv
            ghcr.io/${{ steps.lowercase.outputs.owner }}/lunatv
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -m1 "^## \[" CHANGELOG | sed 's/^## \[\(.*\)\] - .*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          INPUT_TAG="${{ github.event.inputs.tag || '' }}"
          OWNER="${{ steps.lowercase.outputs.owner }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          sanitize_tag() {
            echo "$1" | tr '/ ' '--'
          }

          append_tag() {
            local raw="$1"
            local tag

            [[ -z "$raw" ]] && return 0
            tag="$(sanitize_tag "$raw")"
            [[ -z "$tag" ]] && return 0

            for existing in "${TAGS[@]}"; do
              [[ "$existing" == "$tag" ]] && return 0
            done

            TAGS+=("$tag")
          }

          create_manifest() {
            local image="$1"
            local tag="$2"
            echo "Creating manifest for ${image}:${tag}"
            docker buildx imagetools create -t "${image}:${tag}" \
              $(printf '%s@sha256:%s ' "$image" *)
          }

          declare -a TAGS=()

          if [[ "$REF_TYPE" == "branch" ]]; then
            append_tag "$REF_NAME"
          fi

          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            append_tag "$VERSION"
            append_tag "latest"
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            append_tag "$REF_NAME"
            if [[ "$REF_NAME" == v* ]]; then
              append_tag "${REF_NAME#v}"
            fi
            append_tag "latest"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            append_tag "$INPUT_TAG"
          fi

          if [[ "${#TAGS[@]}" -eq 0 ]]; then
            echo "No tags to publish for this run."
            exit 0
          fi

          printf 'Publishing tags: %s\n' "${TAGS[*]}"

          for tag in "${TAGS[@]}"; do
            create_manifest "endlessjy/lunatv" "$tag"
            create_manifest "ghcr.io/$OWNER/lunatv" "$tag"
          done

  cleanup-refresh:
    runs-on: ubuntu-latest
    needs:
      - merge
    if: always()
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
